# Pilha DESCARTÁVEL dos testes de ponta a ponta (Tarefa 06 da auditoria).
#
# Só Postgres e Redis, em portas que não são as de desenvolvimento, com os
# dados em memória (tmpfs): nada sobrevive ao `down`. Quem sobe e derruba
# é infra/tests/e2e.sh — nunca use este arquivo para desenvolver.
#
# A senha abaixo é de teste e só existe nesta pilha.
name: luxora-e2e

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luxora_e2e
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # Mesma role sem privilégio (luxora_app) do desenvolvimento e do CI:
      # a aplicação sob teste fica sujeita à RLS, como em produção.
      - ../docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luxora_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
