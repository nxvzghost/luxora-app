name: CI

# Fonte: docs/10-Sprint-0/05-Criterios-de-Engenharia.md
# Nenhum PR é mergeável sem este workflow verde — especialmente o job
# test-critical, que roda os 16 Testes Críticos isolados dos demais.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Runner fixado em ubuntu-24.04 (18/10/2026): o rótulo ubuntu-latest passa a
# apontar para o Ubuntu 26 a partir de 19/10/2026, como avisa o próprio GitHub
# nas execuções. Trocar de versão é decisão explícita, com uma execução verde
# na versão nova antes de mudar este arquivo.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Tipos de tudo o que é TypeScript, inclusive os testes: o build só confere
  # o código de produto e o Vitest não confere tipos (Tarefa 06 da auditoria).
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @luxora/backend prisma:generate
        env:
          DATABASE_URL: postgresql://luxora_app:luxora_app_dev_pw@localhost:5432/luxora_test
      - run: pnpm typecheck

  test-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @luxora/backend prisma:generate
        env:
          DATABASE_URL: postgresql://luxora_app:luxora_app_dev_pw@localhost:5432/luxora_test
      - run: pnpm test:unit

  test-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @luxora/backend prisma:generate
        env:
          DATABASE_URL: postgresql://luxora_app:luxora_app_dev_pw@localhost:5432/luxora_test
      # Postgres ignora RLS incondicionalmente para superusuários (ver
      # infra/docker/postgres-init/01-app-role.sql) — migrar e rodar a
      # aplicação com o usuário "postgres" tornaria toda policy de
      # isolamento multi-tenant inerte sem nenhum erro visível. luxora_app
      # não é superusuário nem tem BYPASSRLS.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d luxora_test -v ON_ERROR_STOP=1 -f infra/docker/postgres-init/01-app-role.sql
      - run: pnpm --filter @luxora/backend prisma:migrate
        env:
          DATABASE_URL: postgresql://luxora_app:luxora_app_dev_pw@localhost:5432/luxora_test
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://luxora_app:luxora_app_dev_pw@localhost:5432/luxora_test
          REDIS_URL: redis://localhost:6379

  # Job isolado — os 16 Testes Críticos. Nunca combinar com test-integration:
  # a intenção é que uma falha aqui seja imediatamente visível como bloqueio
  # de segurança/regra de negócio, não misturada com teste comum.
  test-critical:
    runs-on: ubuntu-24.04
    needs: test-integration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @luxora/backend prisma:generate
        env:
          DATABASE_URL: postgresql://luxora_app:luxora_app_dev_pw@localhost:5432/luxora_test
      # Ver comentário equivalente no job test-integration: sem isto, os
      # próprios Testes Críticos de isolamento multi-tenant rodariam contra
      # uma conexão que ignora RLS por completo, sem acusar nada.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d luxora_test -v ON_ERROR_STOP=1 -f infra/docker/postgres-init/01-app-role.sql
      - run: pnpm --filter @luxora/backend prisma:migrate
        env:
          DATABASE_URL: postgresql://luxora_app:luxora_app_dev_pw@localhost:5432/luxora_test
      - run: pnpm --filter @luxora/backend seed
        env:
          DATABASE_URL: postgresql://luxora_app:luxora_app_dev_pw@localhost:5432/luxora_test
      - run: pnpm test:critical
        env:
          DATABASE_URL: postgresql://luxora_app:luxora_app_dev_pw@localhost:5432/luxora_test
          WHATSAPP_TOKEN_ENCRYPTION_KEY: chave-de-teste-nao-usar-em-producao-2026
          JWT_SECRET: jwt-secret-de-teste-nao-usar-em-producao-2026
          WHATSAPP_APP_SECRET: test-app-secret
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: verify-token-de-teste-nao-usar-em-producao-2026

  # Tarefa 06 da auditoria (AD-012) — o fluxo principal da clínica pelo
  # painel, num navegador de verdade: sessão, disponibilidade, consulta,
  # cobrança, pagamento, atraso, pagamento divergente com notificação e
  # estorno. infra/tests/e2e.sh sobe Postgres e Redis descartáveis (não os
  # `services` dos outros jobs), aplica as migrations, constrói backend e
  # painel e destrói tudo no fim. Cada teste cria e remove a própria
  # clínica. Não usa credencial nem serviço externo.
  test-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium do Playwright e bibliotecas do sistema
        run: pnpm --filter @luxora/e2e exec playwright install --with-deps chromium
      - name: Testes de ponta a ponta (pilha descartável)
        run: bash infra/tests/e2e.sh
        env:
          CI: 'true'
      # Só em falha: relatório navegável, trace e captura de tela de cada
      # teste que falhou. Os dados são fictícios, criados pelo próprio teste.
      - name: Diagnóstico da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostico
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Tarefa 04 da auditoria — o caminho de deploy é testado a cada mudança.
  # Constrói as imagens a partir do checkout limpo (o mesmo script do CD) e
  # ensaia, numa pilha descartável do próprio runner: deploy, rollback
  # automático de uma versão quebrada, rollback manual, readiness com
  # Postgres/Redis fora do ar, encerramento gracioso, restauração de backup
  # e exportação de traces. Não usa credencial nem serviço externo.
  deploy-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Antes do build, porque não usa imagem: roda o deploy.sh inteiro contra um
      # docker e um curl simulados e confere o resultado do proxy HTTPS (desativado,
      # sucesso parcial, ativado), o histórico e os códigos de saída 1, 2 e 3.
      - name: Resultado do proxy no deploy (comandos simulados)
        run: bash infra/tests/deploy-proxy-test.sh
      # Também antes do build: o external-backup.sh inteiro (check, push, pull e
      # pull --drill) contra um docker simulado e um armazenamento S3 falso em
      # 127.0.0.1 (node), com dados fictícios. Sem rede externa nem credencial.
      - name: Backup externo (armazenamento e docker simulados)
        run: bash infra/tests/external-backup-test.sh
      # Também antes do build: o verificador da idade do último backup externo, com
      # marcadores fictícios em diretórios temporários e "agora" fixo. Só leitura;
      # não usa docker, rede nem credencial e não envia alerta.
      - name: Idade do backup externo (marcadores simulados)
        run: bash infra/tests/external-backup-health-test.sh
      - name: Versão (commit curto)
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build das imagens
        run: bash infra/scripts/build-images.sh --version "$VERSION" --api-url http://localhost:13000/api/v1
      - name: Ensaio de deploy, rollback e restauração
        run: bash infra/tests/rehearsal.sh --backend-version "$VERSION" --frontend-version "$VERSION"
